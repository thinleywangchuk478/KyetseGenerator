<!DOCTYPE html>
<html lang="dz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>སྐྱེས་རྩིས་བསྐྲུན་ཁང་། — Kyetse Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ════ HEADER ════ -->
<header class="app-header">
  <div class="header-inner">
    <div>
      <div class="header-title">༄༅། །སྐྱེས་རྩིས་བསྐྲུན་ཁང་།</div>
      <div class="header-sub">Kyetse Generator</div>
    </div>
    <div class="header-badge" id="sheet-status">⏳ Loading Sheet…</div>
  </div>
</header>

<!-- ════ MAIN BODY ════ -->
<div class="app-body">

  <!-- ══ LEFT: INPUT PANEL ══ -->
  <div class="left-panel">

    <!-- Personal Info -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">༄</div>
        <div class="card-header-title">སྤྱིར་བཏང་གནས་ཚུལ།</div>
      </div>
      <div class="card-body">

        <div class="form-row">
          <div class="field">
            <label>བུ་/བུམོའི་མིང་།</label>
            <input type="text" id="child-name" placeholder="མིང་བཙུགས།">
          </div>
          <div class="field">
            <label>ལོ་ཚད།</label>
            <input type="text" id="child-age" placeholder="ལོ་ཚད་བཙུགས།">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>ཕའི་མིང་།</label>
            <input type="text" id="father-name" placeholder="ཕའི་མིང་བཙུགས།">
          </div>
          <div class="field">
            <label>མའི་མིང་།</label>
            <input type="text" id="mother-name" placeholder="མའི་མིང་བཙུགས།">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>ཕའི་སྐྱེས་ལོ།</label>
            <input type="text" id="father-year" placeholder="དཔེར་ན། ས་ཕོ་གླང།">
          </div>
          <div class="field">
            <label>མའི་སྐྱེས་ལོ།</label>
            <input type="text" id="mother-year" placeholder="དཔེར་ན། ཤིང་མོ་ཡོས།">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>ཕའི་ལོ་ཚད།</label>
            <input type="text" id="father-age" placeholder="ཕའི་ལོ་ཚད།">
          </div>
          <div class="field">
            <label>མའི་ལོ་ཚད།</label>
            <input type="text" id="mother-age" placeholder="མའི་ལོ་ཚད།">
          </div>
        </div>

        <div class="form-row triple">
          <div class="field">
            <label>སྐྱེས་ཚེས། (ཉིན)</label>
            <input type="text" id="dob-day" placeholder="དཔེར་ན། ༡༥">
          </div>
          <div class="field">
            <label>སྐྱེས་ཟླ།</label>
            <input type="text" id="dob-month" placeholder="དཔེར་ན། ཟླ་བ་གསུམ་པ།">
          </div>
          <div class="field">
            <label>སྐྱེས་ལོ།</label>
            <input type="text" id="dob-year" placeholder="དཔེར་ན། ༢༠༢༤">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>གནས་ཡུལ། (སྐྱེས་ས)</label>
            <input type="text" id="birth-place" placeholder="སྐྱེས་ས་བཙུགས།">
          </div>
          <div class="field">
            <label>ད་ལྟའི་གནས་ཡུལ།</label>
            <input type="text" id="current-place" placeholder="ད་ལྟའི་གནས་ས།">
          </div>
        </div>

        <div class="form-row full">
          <div class="field">
            <label>གཞན་གནས་ཚུལ། (ཁ་སྐོང་ཡོད་ན་བྲིས།)</label>
            <textarea id="extra-notes" placeholder="གཞན་གནས་ཚུལ་གང་རུང་འདིར་བཙུགས།" rows="3" style="font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;width:100%;resize:vertical;outline:none;color:var(--dark);background:var(--white);"></textarea>
          </div>
        </div>

      </div>
    </div>

    <!-- Kyetse Dropdowns -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">☸</div>
        <div class="card-header-title">སྐྱེས་རྩིས་ཀྱི་གནད་དོན།</div>
      </div>
      <div class="card-body">
        <div id="loading-msg" style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">
          གཞི་གྲངས་བཞུད་བཞིན་པ། <span class="loading-dot"></span>
        </div>
        <div class="kyetse-grid" id="kyetse-grid" style="display:none"></div>
      </div>
    </div>

    <!-- Section Toggles -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">✓</div>
        <div class="card-header-title">ལུང་སྟོན་ཁག་འདེམས།</div>
      </div>
      <div class="card-body">
        <div class="section-toggles" id="section-toggles"></div>
      </div>
    </div>

    <!-- Generate Button -->
    <div class="btn-row">
      <button class="btn btn-primary" onclick="generateReport()" style="flex:1;justify-content:center;font-size:15px;padding:12px;">
        ☸ སྐྱེས་རྩིས་གསར་བཟོ།
      </button>
      <button class="btn btn-outline" onclick="clearForm()">↺ ག་ར་བསལ།</button>
    </div>

  </div><!-- /left-panel -->

  <!-- ══ RIGHT: PREVIEW PANEL ══ -->
  <div class="right-panel">
    <div class="card">
      <div class="preview-toolbar">
        <div class="preview-toolbar-title">📄 སྐྱེས་རྩིས་འབྲི་ས།</div>
        <div class="btn-row" style="margin:0">
          <button class="btn btn-sm btn-gold" onclick="exportDOCX()">⬇ Word (.docx)</button>
          <button class="btn btn-sm btn-outline" onclick="window.print()">🖨 Print</button>
          <button class="btn btn-sm btn-green" onclick="saveReport()">💾 Save</button>
        </div>
      </div>
      <div class="preview-body">
        <div id="report-doc">
          <div class="report-empty">
            <div class="report-empty-icon">༄༅</div>
            <div>སྐྱེས་རྩིས་ཀྱི་གནད་དོན་གདམ་ཁ་<br>སྐྱེས་རྩིས་གསརཔ་བཟོ།</div>
          </div>
        </div>
      </div>
      <div class="status-bar" id="status-bar"></div>
    </div>

    <!-- Saved Reports -->
    <div class="card" id="saved-card" style="display:none">
      <div class="card-header">
        <div class="card-header-icon">📁</div>
        <div class="card-header-title">སྔོན་གྱི་སྐྱེས་རྩིས།</div>
      </div>
      <div class="card-body">
        <div class="saved-list" id="saved-list"></div>
      </div>
    </div>

  </div><!-- /right-panel -->

</div><!-- /app-body -->

<!-- App logic -->
<script src="app.js"></script>

</body>
</html>
